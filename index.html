<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Fumika Kato</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body{
            margin:0;
            background:linear-gradient(180deg,#fff8fb,#f5f9ff);
            font-family:"M PLUS Rounded 1c",sans-serif;
            color:#555;
        }

        .container{
            width:80%;
            max-width:900px;
            margin:80px auto;
            background:white;
            border-radius:25px;
            padding:50px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            text-align:center;
        }

        img{
            width:180px;
            height:180px;
            border-radius:50%;
            object-fit:cover;
            border:6px solid #ffe0ec;
            margin-bottom:25px;
        }

        h1{
            font-size:48px;
            color:#ff7aa2;
            margin-bottom:10px;
        }

        h2{
            color:#888;
            font-weight:normal;
            margin-top:0;
        }

        p{
            font-size:18px;
            line-height:1.8;
        }

        .button{
            display:inline-block;
            margin-top:30px;
            padding:12px 30px;
            background:#ffb6c1;
            color:white;
            text-decoration:none;
            border-radius:50px;
            transition:.3s;
            font-weight:bold;
        }

        .button:hover{
            background:#ff8fb1;
            transform:translateY(-3px);
        }

        .card{
            margin-top:50px;
            background:#fff7fa;
            border-radius:20px;
            padding:25px;
        }

        ul{
            list-style:none;
            padding:0;
        }

        li{
            margin:10px 0;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="container">

    <!-- 自分の写真 -->
    <img src="profile.jpg" alt="プロフィール写真">

    <h1>加藤 郁花</h1>

    <h2>Fumika Kato</h2>

    <p>
        横浜国立大学<br>
        森研究室　学部4年
    </p>

    <a href="mailto:example@example.com" class="button">
        Contact
    </a>

    <div class="card">

        <h2>Research</h2>

        <p>
            Large Language Model<br>
            Jailbreak Attack<br>
            AI Safety
        </p>

    </div>

</div>

</body>
</html>
